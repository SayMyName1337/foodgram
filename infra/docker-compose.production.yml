volumes:
  pg_data:
  static:
  media:
  frontend_static:

services:

  db:
    image: postgres:13
    env_file: .env
    restart: unless-stopped
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 10s
      retries: 5

  backend:
    image: saymyname157/foodgram_backend:latest
    env_file: .env
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static:/app/static_backend
      - media:/app/media

  frontend:
    image: saymyname157/foodgram_frontend:latest
    env_file: .env
    command: cp -r /app/build/. /frontend_static/
    volumes:
      - frontend_static:/frontend_static

  gateway:
    image: nginx:1.25.4-alpine
    env_file: .env
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - 9090:80
    volumes:
      - frontend_static:/usr/share/nginx/html/
      - static:/static_backend
      - media:/media
      - ./nginx.conf:/etc/nginx/conf.d/default.conf